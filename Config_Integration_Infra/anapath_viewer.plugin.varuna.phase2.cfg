# Telemis PACS - VarunaPoC WSI Viewer Plugin Configuration
# =============================================================================
# Phase 2: Network Integration (Phase 2.1 and 2.2)
#
# This configuration file enables Telemis PACS to launch VarunaPoC web viewer
# when users click on histological slides.

[VARUNA_VIEWER]

# Third Party Software Configuration
# =============================================================================

# Launch Chrome with VarunaPoC URL
# The URL includes the slide ID extracted from DICOM metadata
thirdPartySoftware = "C:\Program Files\Google\Chrome\Application\chrome.exe" "http://varun-p-01/slide/{$study.examindex$}"

# Alternative: Firefox
# thirdPartySoftware = "C:\Program Files\Mozilla Firefox\firefox.exe" "http://varun-p-01/slide/{$study.examindex$}"

# Alternative: Microsoft Edge
# thirdPartySoftware = "C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe" "http://varun-p-01/slide/{$study.examindex$}"

# Alternative: Launch in new tab (if browser already open)
# thirdPartySoftware = "C:\Program Files\Google\Chrome\Application\chrome.exe" --new-tab "http://varun-p-01/slide/{$study.examindex$}"

# URL field (kept empty when using thirdPartySoftware)
thirdPartyUrl =

# Plugin Display Configuration
# =============================================================================

# Icon displayed in Telemis UI (32x32 PNG recommended)
# Place icon in Telemis icons directory: C:\Program Files\Telemis\Icons\
thirdPartySoftwareIcon = microscope-viewer.png

# Alternative icons:
# thirdPartySoftwareIcon = wsi-viewer.png
# thirdPartySoftwareIcon = histology.png

# Plugin name shown in Telemis UI
thirdPartySoftwareName = VarunaPoC - WSI Viewer

# Alternative names:
# thirdPartySoftwareName = Histology Viewer
# thirdPartySoftwareName = Slide Viewer - VarunaPoC

# Exit Code Configuration
# =============================================================================

# Expected exit code when browser closes (0 = success)
okExitCode = 0

# Command Logging (optional)
# =============================================================================

# Save executed command to file for debugging (leave empty to disable)
saveCommandTo =

# Alternative: Enable logging
# saveCommandTo = C:\Telemis\Logs\varuna-plugin.log

# Available Telemis Variables
# =============================================================================
# These variables are automatically replaced by Telemis when launching the viewer:
#
# Study Information:
#   {$study.examindex$}           → Slide ID (e.g., AO.25B27859.2.1.3)
#   {$study.seriesiuid$}          → DICOM Series Instance UID
#   {$study.studyiuid$}           → DICOM Study Instance UID
#   {$study.accessionNumber$}     → Accession Number
#
# Date Information:
#   {$study.acquisitionDate.dateyyyy$}     → Year (e.g., 2025)
#   {$study.acquisitionDate.datemm$}       → Month (e.g., 12)
#   {$study.acquisitionDate.datedd$}       → Day (e.g., 03)
#   {$study.acquisitionDate.dateyyyymmdd$} → Full date (e.g., 20251203)
#
# Patient Information (use carefully - GDPR/HIPAA compliance required):
#   {$patient.patientID$}         → Patient ID (anonymized)
#   {$patient.patientName$}       → Patient name (avoid if possible)
#
# For full list, consult: Telemis Integration Guide or contact Telemis support

# VarunaPoC Frontend Routing
# =============================================================================
# The frontend receives the slide ID from the URL path:
#   http://varun-p-01/slide/{slide_id}
#
# Frontend (src/main.js) extracts slide_id and calls backend API:
#   GET /api/slides/by-id/{slide_id}
#
# Backend (routes/slides.py) resolves slide_id to file path:
#   - Searches in SLIDES_REPOSITORY_PATH
#   - Returns slide metadata and tile URLs
#
# Example flow:
#   1. Telemis launches: http://varun-p-01/slide/AO.25B27859.2.1.3
#   2. Frontend extracts: slide_id = "AO.25B27859.2.1.3"
#   3. Frontend calls: GET /api/slides/by-id/AO.25B27859.2.1.3
#   4. Backend searches: /slides/**/AO.25B27859.2.1.3.* (mrxs, bif, tif)
#   5. Backend returns: {id, path, format, dimensions, ...}
#   6. Frontend opens slide in OpenSeadragon viewer

# Installation Instructions
# =============================================================================
#
# 1. Copy this file to Telemis plugins directory:
#    C:\Program Files\Telemis\Plugins\anapath_viewer.plugin.varuna.phase2.cfg
#
# 2. Copy viewer icon to Telemis icons directory:
#    C:\Program Files\Telemis\Icons\microscope-viewer.png
#
# 3. Restart Telemis PACS service:
#    - Open Services (services.msc)
#    - Find "Telemis PACS Service"
#    - Right-click → Restart
#
# 4. Test plugin:
#    - Open Telemis PACS client
#    - Navigate to a histological slide study
#    - Right-click on slide → "Open with" → "VarunaPoC - WSI Viewer"
#    - Chrome should open with: http://varun-p-01/slide/{slide_id}
#
# 5. If plugin doesn't appear:
#    - Check file location and name
#    - Check file permissions (must be readable by Telemis service)
#    - Check Telemis logs: C:\Program Files\Telemis\Logs\
#    - Verify [VARUNA_VIEWER] section name is correct
#
# 6. If browser doesn't open:
#    - Check browser path in thirdPartySoftware (must be exact)
#    - Check URL format (http://varun-p-01 must be accessible)
#    - Test URL manually in browser first
#
# 7. If slide doesn't load in VarunaPoC:
#    - Check VarunaPoC deployment (Phase 2.1 or 2.2)
#    - Check slide_id matches file naming convention
#    - Check backend logs: docker logs varuna-backend-phase2.X
#    - Test API directly: curl http://varun-p-01:8000/api/slides/by-id/{slide_id}

# Troubleshooting
# =============================================================================
#
# Problem: Plugin not appearing in Telemis UI
# Solution:
#   - Verify file is in correct directory with .cfg extension
#   - Restart Telemis service
#   - Check Telemis configuration: Tools → Options → Third Party Software
#
# Problem: Browser opens but shows "Cannot reach this page"
# Solution:
#   - Verify VarunaPoC is running: curl http://varun-p-01/api/health
#   - Check DNS/hosts file: ping varun-p-01
#   - Check firewall: ports 80 and 8000 must be open
#   - See: docs/Deployment/NETWORK_TROUBLESHOOTING.md
#
# Problem: Browser opens but slide not found
# Solution:
#   - Check slide ID format matches files on server
#   - Check backend logs for file resolution errors
#   - Verify slides are accessible: docker exec varuna-backend-phase2.X ls /slides
#   - Test API: curl http://varun-p-01:8000/api/slides/by-id/{slide_id}
#
# Problem: Browser opens wrong slide
# Solution:
#   - Verify {$study.examindex$} variable contains correct slide ID
#   - Check DICOM metadata: examindex should match file naming convention
#   - Contact Telemis support for variable mapping

