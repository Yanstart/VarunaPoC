# Pre-commit hooks for VarunaPoC
# Run: pre-commit install
# Test: pre-commit run --all-files

repos:
  # =========================
  # Security - Detect secrets BEFORE commit
  # =========================
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ['--baseline', '.secrets.baseline']
        exclude: package-lock.json

  # =========================
  # Git hygiene
  # =========================
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      # Prevent large files from being committed
      - id: check-added-large-files
        args: ['--maxkb=1000']  # 1MB max

      # Prevent committing to main/master directly
      - id: no-commit-to-branch
        args: ['--branch', 'main', '--branch', 'master']

      # Check for merge conflicts
      - id: check-merge-conflict

      # Prevent files that differ only in case (breaks on Windows/macOS)
      - id: check-case-conflict

      # Ensure files end with newline
      - id: end-of-file-fixer

      # Remove trailing whitespace
      - id: trailing-whitespace

      # Check YAML syntax
      - id: check-yaml
        exclude: ^\.github/

      # Check JSON syntax
      - id: check-json

      # Detect private keys
      - id: detect-private-key

  # =========================
  # Python code quality
  # =========================
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.6
    hooks:
      - id: ruff
        name: Ruff linting (Python)
        args: [--fix, --exit-non-zero-on-fix]
        files: ^backend/
      - id: ruff-format
        name: Ruff formatting (Python)
        files: ^backend/

  # Black formatter (alternative to ruff-format, can be used together)
  - repo: https://github.com/psf/black
    rev: 24.1.1
    hooks:
      - id: black
        name: Black formatting (Python)
        files: ^backend/

  # isort - Import sorting
  - repo: https://github.com/pycqa/isort
    rev: 5.13.2
    hooks:
      - id: isort
        name: isort (Python imports)
        args: ["--profile", "black"]
        files: ^backend/

  # =========================
  # Implementation docs check
  # =========================
  - repo: local
    hooks:
      - id: check-implementation-docs
        name: Implementation docs up-to-date
        entry: Scripts/check-implementation-docs.sh
        language: script
        files: ^docs/implementation/
        pass_filenames: false

# Configuration for detect-secrets
# Run: detect-secrets scan > .secrets.baseline
# to create the baseline file
