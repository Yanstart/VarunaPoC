# Grafana Dashboard Provisioning Configuration for VarunaPoC

apiVersion: 1

providers:
  - name: 'VarunaPoC Dashboards'
    orgId: 1
    folder: 'VarunaPoC'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 10
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards
      foldersFromFilesStructure: false
