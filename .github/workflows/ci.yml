name: CI - Continuous Integration

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancel in-progress runs for same PR/branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege default
permissions:
  contents: read

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"

jobs:
  # ============================================
  # Path Filtering (skip unchanged components on PRs)
  # ============================================
  changes:
    name: Detect Changes
    runs-on: ${{ vars.USE_SELF_HOSTED == 'true' && 'self-hosted' || 'ubuntu-latest' }}
    permissions:
      contents: read
      pull-requests: read
    outputs:
      backend: ${{ github.event_name != 'pull_request' || steps.filter.outputs.backend == 'true' }}
      frontend: ${{ github.event_name != 'pull_request' || steps.filter.outputs.frontend == 'true' }}
      docs_only: ${{ github.event_name == 'pull_request' && steps.filter.outputs.backend != 'true' && steps.filter.outputs.frontend != 'true' && steps.filter.outputs.docs == 'true' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        id: filter
        if: github.event_name == 'pull_request'
        with:
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/ci.yml'
            frontend:
              - 'frontend/**'
              - '.github/workflows/ci.yml'
            docs:
              - '**/*.md'
              - 'docs/**'
              - '**/info.md'

  # ============================================
  # Backend CI
  # ============================================
  backend-lint:
    name: Backend - Lint
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ${{ vars.USE_SELF_HOSTED == 'true' && 'self-hosted' || 'ubuntu-latest' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install linting dependencies
        run: |
          pip install --upgrade pip
          pip install ruff black isort

      - name: Run Ruff (fast linter)
        run: |
          cd backend
          ruff check . --output-format=github --exclude scripts

      - name: Check Black formatting
        run: |
          cd backend
          black --check --diff --exclude scripts .

      - name: Check import sorting (isort)
        run: |
          cd backend
          isort --check-only --diff --skip scripts .

  backend-test:
    name: Backend - Test
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ${{ vars.USE_SELF_HOSTED == 'true' && 'self-hosted' || 'ubuntu-latest' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            openslide-tools \
            libopenslide0 \
            swig \
            build-essential

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          cd backend
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-asyncio pytest-xdist "httpx>=0.25.0,<0.28.0" matplotlib

      - name: Run pytest
        env:
          OPENSLIDE_NO_REEXEC: "1"
          AUTH_ENABLED: "false"
          DATABASE_URL: "sqlite+aiosqlite:///./test.db"
        run: |
          cd backend
          pytest --cov=. --cov-report=xml --cov-report=term-missing --verbose -m "not slow"

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 # v4
        with:
          file: backend/coverage.xml
          flags: backend
          name: backend-coverage
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  backend-docker:
    name: Backend - Docker Build
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ${{ vars.USE_SELF_HOSTED == 'true' && 'self-hosted' || 'ubuntu-latest' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Free disk space for Docker build
        run: docker system prune -f 2>/dev/null || true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0

      - name: Build backend Docker image
        uses: docker/build-push-action@1dc73863535b631f98b2378be8619f83b136f4a0 # v6.17.0
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          load: true
          tags: varuna-backend:ci-test
          cache-from: type=local,src=/data/VarunaPoC/.buildx-cache/backend
          cache-to: type=local,dest=/data/VarunaPoC/.buildx-cache-new/backend,mode=max

      - name: Test backend container
        run: |
          CONTAINER="ci-backend-${{ github.run_id }}"
          docker rm -f "$CONTAINER" 2>/dev/null || true
          docker run -d --name "$CONTAINER" varuna-backend:ci-test
          for i in $(seq 1 30); do
            if docker exec "$CONTAINER" curl -sf http://localhost:8000/api/health > /dev/null 2>&1; then
              echo "Backend container healthy (attempt $i)"
              exit 0
            fi
            echo "Waiting for backend container... ($i/30)"
            sleep 2
          done
          echo "Backend container failed to respond"
          docker logs "$CONTAINER"
          exit 1

      - name: Cleanup
        if: always()
        run: |
          docker rm -f "ci-backend-${{ github.run_id }}" 2>/dev/null || true
          rm -rf /data/VarunaPoC/.buildx-cache/backend
          mv /data/VarunaPoC/.buildx-cache-new/backend /data/VarunaPoC/.buildx-cache/backend 2>/dev/null || true

  # ============================================
  # Frontend CI
  # ============================================
  frontend-lint:
    name: Frontend - Lint
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ${{ vars.USE_SELF_HOSTED == 'true' && 'self-hosted' || 'ubuntu-latest' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Run ESLint
        run: |
          cd frontend
          npm run lint

  frontend-build:
    name: Frontend - Build
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ${{ vars.USE_SELF_HOSTED == 'true' && 'self-hosted' || 'ubuntu-latest' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Build frontend
        run: |
          cd frontend
          npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7

  frontend-docker:
    name: Frontend - Docker Build
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ${{ vars.USE_SELF_HOSTED == 'true' && 'self-hosted' || 'ubuntu-latest' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Free disk space for Docker build
        run: docker system prune -f 2>/dev/null || true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0

      - name: Build frontend Docker image
        uses: docker/build-push-action@1dc73863535b631f98b2378be8619f83b136f4a0 # v6.17.0
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          load: true
          tags: varuna-frontend:ci-test
          cache-from: type=local,src=/data/VarunaPoC/.buildx-cache/frontend
          cache-to: type=local,dest=/data/VarunaPoC/.buildx-cache-new/frontend,mode=max

      - name: Test frontend container
        run: |
          CONTAINER="ci-frontend-${{ github.run_id }}"
          docker rm -f "$CONTAINER" 2>/dev/null || true
          docker run -d --name "$CONTAINER" varuna-frontend:ci-test
          for i in $(seq 1 30); do
            if docker exec "$CONTAINER" curl -sf http://localhost:80/ > /dev/null 2>&1; then
              echo "Frontend container healthy (attempt $i)"
              exit 0
            fi
            echo "Waiting for frontend container... ($i/30)"
            sleep 2
          done
          echo "Frontend container failed to respond"
          docker logs "$CONTAINER"
          exit 1

      - name: Cleanup
        if: always()
        run: |
          docker rm -f "ci-frontend-${{ github.run_id }}" 2>/dev/null || true
          rm -rf /data/VarunaPoC/.buildx-cache/frontend
          mv /data/VarunaPoC/.buildx-cache-new/frontend /data/VarunaPoC/.buildx-cache/frontend 2>/dev/null || true

  # ============================================
  # E2E - Playwright Browser Tests
  # ============================================
  e2e:
    name: E2E - Playwright
    needs: [frontend-build, backend-docker]
    runs-on: ${{ vars.USE_SELF_HOSTED == 'true' && 'self-hosted' || 'ubuntu-latest' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: Install Playwright browsers
        run: |
          cd frontend
          if dpkg -s libgbm1 > /dev/null 2>&1; then
            echo "System deps present — installing browser only"
            npx playwright install chromium
          else
            npx playwright install --with-deps chromium
          fi

      - name: Build frontend
        run: |
          cd frontend
          npm run build

      - name: Start frontend preview server
        run: |
          cd frontend
          npx vite preview --port 5173 &
          # Wait for the preview server to be ready
          for i in $(seq 1 15); do
            if curl -sf http://localhost:5173/ > /dev/null 2>&1; then
              echo "Frontend preview server is ready"
              exit 0
            fi
            echo "Waiting for frontend... ($i/15)"
            sleep 1
          done
          echo "Frontend failed to start"
          exit 1

      - name: Build backend Docker image
        run: |
          cd backend
          docker build -t varuna-backend:e2e-test .

      - name: Start backend container
        run: |
          CONTAINER="e2e-backend-${{ github.run_id }}"
          docker rm -f "$CONTAINER" 2>/dev/null || true
          # Share runner's network namespace so backend is on localhost:8000
          # DooD: runner is a container, $(hostname) returns its container ID
          docker run -d --name "$CONTAINER" \
            --network="container:$(hostname)" \
            -e CORS_ORIGINS="*" \
            varuna-backend:e2e-test

      - name: Wait for backend healthy
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/api/health > /dev/null 2>&1; then
              echo "Backend healthy on localhost:8000 (attempt $i)"
              exit 0
            fi
            echo "Waiting for backend... ($i/30)"
            sleep 2
          done
          echo "Backend failed to start"
          docker logs "e2e-backend-${{ github.run_id }}"
          exit 1

      - name: Run Playwright tests
        run: |
          cd frontend
          npx playwright test --config=e2e/playwright.config.js --project=chromium
        env:
          CI: true
          BASE_URL: http://localhost:5173
          API_URL: http://localhost:8000

      - name: Upload Playwright report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: playwright-report
          path: frontend/e2e/playwright-report/
          retention-days: 14

      - name: Upload test results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: playwright-results
          path: frontend/e2e/test-results/
          retention-days: 7

      - name: Cleanup
        if: always()
        run: docker rm -f "e2e-backend-${{ github.run_id }}" 2>/dev/null || true

  # ============================================
  # CI Status Check (required for PR merge)
  # ============================================
  ci-status:
    name: CI Status
    needs:
      - changes
      - backend-lint
      - backend-test
      - backend-docker
      - frontend-lint
      - frontend-build
      - frontend-docker
      - e2e
    runs-on: ${{ vars.USE_SELF_HOSTED == 'true' && 'self-hosted' || 'ubuntu-latest' }}
    if: always()

    steps:
      - name: Check CI results
        env:
          BACKEND_LINT: ${{ needs.backend-lint.result }}
          BACKEND_TEST: ${{ needs.backend-test.result }}
          BACKEND_DOCKER: ${{ needs.backend-docker.result }}
          FRONTEND_LINT: ${{ needs.frontend-lint.result }}
          FRONTEND_BUILD: ${{ needs.frontend-build.result }}
          FRONTEND_DOCKER: ${{ needs.frontend-docker.result }}
          E2E: ${{ needs.e2e.result }}
          DOCS_ONLY: ${{ needs.changes.outputs.docs_only }}
        run: |
          echo "=== CI Job Results ==="
          echo "backend-lint:   $BACKEND_LINT"
          echo "backend-test:   $BACKEND_TEST"
          echo "backend-docker: $BACKEND_DOCKER"
          echo "frontend-lint:  $FRONTEND_LINT"
          echo "frontend-build: $FRONTEND_BUILD"
          echo "frontend-docker:$FRONTEND_DOCKER"
          echo "e2e:            $E2E"
          echo "docs_only:      $DOCS_ONLY"
          echo "======================"

          FAILED=0
          for result in "$BACKEND_LINT" "$BACKEND_TEST" "$BACKEND_DOCKER" \
                        "$FRONTEND_LINT" "$FRONTEND_BUILD" "$FRONTEND_DOCKER" "$E2E"; do
            # success and skipped are both OK (skipped = path filtering)
            if [ "$result" = "failure" ] || [ "$result" = "cancelled" ]; then
              FAILED=1
            fi
          done

          if [ "$FAILED" = "1" ]; then
            echo "::error::One or more CI jobs failed"
            exit 1
          fi

          echo "All CI checks passed (skipped jobs are OK — path filtering)"
