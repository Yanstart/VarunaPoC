name: CI - Continuous Integration

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

# Cancel in-progress runs for same PR/branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege default
permissions:
  contents: read

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"

jobs:
  # ============================================
  # Path Filtering (skip unchanged components on PRs)
  # ============================================
  changes:
    name: Detect Changes
    runs-on: ${{ vars.USE_SELF_HOSTED == 'true' && 'self-hosted' || 'ubuntu-latest' }}
    outputs:
      backend: ${{ github.event_name != 'pull_request' || steps.filter.outputs.backend == 'true' }}
      frontend: ${{ github.event_name != 'pull_request' || steps.filter.outputs.frontend == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name == 'pull_request'
        with:
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/ci.yml'
            frontend:
              - 'frontend/**'
              - '.github/workflows/ci.yml'

  # ============================================
  # Backend CI
  # ============================================
  backend-lint:
    name: Backend - Lint
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ${{ vars.USE_SELF_HOSTED == 'true' && 'self-hosted' || 'ubuntu-latest' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install linting dependencies
        run: |
          pip install --upgrade pip
          pip install ruff black isort

      - name: Run Ruff (fast linter)
        run: |
          cd backend
          ruff check . --output-format=github

      - name: Check Black formatting
        run: |
          cd backend
          black --check --diff .

      - name: Check import sorting (isort)
        run: |
          cd backend
          isort --check-only --diff .

  backend-test:
    name: Backend - Test
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ${{ vars.USE_SELF_HOSTED == 'true' && 'self-hosted' || 'ubuntu-latest' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install OpenSlide system dependencies
        run: |
          if dpkg -s libopenslide0 > /dev/null 2>&1; then
            echo "OpenSlide already installed — skipping"
          else
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends \
              openslide-tools \
              libopenslide0
          fi

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          cd backend
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-asyncio pytest-xdist "httpx>=0.25.0,<0.28.0" matplotlib

      - name: Run pytest
        run: |
          cd backend
          pytest -n auto --cov=. --cov-report=xml --cov-report=term-missing --verbose -m "not slow"

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: backend/coverage.xml
          flags: backend
          name: backend-coverage
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  backend-docker:
    name: Backend - Docker Build
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ${{ vars.USE_SELF_HOSTED == 'true' && 'self-hosted' || 'ubuntu-latest' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          load: true
          tags: varuna-backend:ci-test
          cache-from: |
            type=local,src=/tmp/.buildx-cache/backend
            type=registry,ref=localhost:5000/varuna/backend:buildcache
          cache-to: type=local,dest=/tmp/.buildx-cache-new/backend,mode=max

      - name: Test backend container
        run: |
          CONTAINER="ci-backend-${{ github.run_id }}"
          docker rm -f "$CONTAINER" 2>/dev/null || true
          docker run -d --name "$CONTAINER" -P varuna-backend:ci-test
          sleep 10
          PORT=$(docker port "$CONTAINER" 8000/tcp | head -1 | cut -d: -f2)
          curl -f "http://localhost:$PORT/api/health" || \
            (echo "--- container logs ---" && docker logs "$CONTAINER" && exit 1)

      - name: Cleanup
        if: always()
        run: |
          docker rm -f "ci-backend-${{ github.run_id }}" 2>/dev/null || true
          rm -rf /tmp/.buildx-cache/backend
          mv /tmp/.buildx-cache-new/backend /tmp/.buildx-cache/backend 2>/dev/null || true

  # ============================================
  # Frontend CI
  # ============================================
  frontend-lint:
    name: Frontend - Lint
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ${{ vars.USE_SELF_HOSTED == 'true' && 'self-hosted' || 'ubuntu-latest' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Run ESLint
        run: |
          cd frontend
          npm run lint

  frontend-build:
    name: Frontend - Build
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ${{ vars.USE_SELF_HOSTED == 'true' && 'self-hosted' || 'ubuntu-latest' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Build frontend
        run: |
          cd frontend
          npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7

  frontend-docker:
    name: Frontend - Docker Build
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ${{ vars.USE_SELF_HOSTED == 'true' && 'self-hosted' || 'ubuntu-latest' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build frontend Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          load: true
          tags: varuna-frontend:ci-test
          cache-from: |
            type=local,src=/tmp/.buildx-cache/frontend
            type=registry,ref=localhost:5000/varuna/frontend:buildcache
          cache-to: type=local,dest=/tmp/.buildx-cache-new/frontend,mode=max

      - name: Test frontend container
        run: |
          CONTAINER="ci-frontend-${{ github.run_id }}"
          docker rm -f "$CONTAINER" 2>/dev/null || true
          docker run -d --name "$CONTAINER" -P varuna-frontend:ci-test
          sleep 10
          PORT=$(docker port "$CONTAINER" 80/tcp | head -1 | cut -d: -f2)
          curl -f "http://localhost:$PORT/" || \
            (echo "--- container logs ---" && docker logs "$CONTAINER" && exit 1)

      - name: Cleanup
        if: always()
        run: |
          docker rm -f "ci-frontend-${{ github.run_id }}" 2>/dev/null || true
          rm -rf /tmp/.buildx-cache/frontend
          mv /tmp/.buildx-cache-new/frontend /tmp/.buildx-cache/frontend 2>/dev/null || true

  # ============================================
  # Integration Check
  # ============================================
  integration:
    name: Integration Check
    needs: [backend-test, backend-docker, frontend-build, frontend-docker]
    runs-on: ${{ vars.USE_SELF_HOSTED == 'true' && 'self-hosted' || 'ubuntu-latest' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cleanup stale containers
        run: |
          docker rm -f "integ-backend-${{ github.run_id }}" "integ-frontend-${{ github.run_id }}" 2>/dev/null || true

      - name: Start backend container
        run: |
          cd backend
          docker build -t varuna-backend:test .
          docker run -d --name "integ-backend-${{ github.run_id }}" \
            -P \
            -e CORS_ORIGINS="*" \
            varuna-backend:test

      - name: Start frontend container
        run: |
          cd frontend
          docker build -t varuna-frontend:test .
          docker run -d --name "integ-frontend-${{ github.run_id }}" \
            -P \
            varuna-frontend:test

      - name: Wait for services and test
        run: |
          BE_PORT=$(docker port "integ-backend-${{ github.run_id }}" 8000/tcp | head -1 | cut -d: -f2)
          FE_PORT=$(docker port "integ-frontend-${{ github.run_id }}" 80/tcp | head -1 | cut -d: -f2)
          sleep 15
          curl -f "http://localhost:$BE_PORT/api/health" && echo "Backend healthy"
          curl -f "http://localhost:$FE_PORT/" && echo "Frontend accessible"

      - name: Cleanup
        if: always()
        run: |
          docker rm -f "integ-backend-${{ github.run_id }}" "integ-frontend-${{ github.run_id }}" 2>/dev/null || true

  # ============================================
  # E2E - Playwright Browser Tests
  # ============================================
  e2e:
    name: E2E - Playwright
    needs: [frontend-build, backend-docker]
    runs-on: ${{ vars.USE_SELF_HOSTED == 'true' && 'self-hosted' || 'ubuntu-latest' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: Install Playwright browsers
        run: |
          cd frontend
          if dpkg -s libgbm1 > /dev/null 2>&1; then
            echo "System deps present — installing browser only"
            npx playwright install chromium
          else
            npx playwright install --with-deps chromium
          fi

      - name: Build frontend
        run: |
          cd frontend
          npm run build

      - name: Start frontend preview server
        run: |
          cd frontend
          npx vite preview --port 5173 &
          # Wait for the preview server to be ready
          for i in $(seq 1 15); do
            if curl -sf http://localhost:5173/ > /dev/null 2>&1; then
              echo "Frontend preview server is ready"
              exit 0
            fi
            echo "Waiting for frontend... ($i/15)"
            sleep 1
          done
          echo "Frontend failed to start"
          exit 1

      - name: Build backend Docker image
        run: |
          cd backend
          docker build -t varuna-backend:e2e-test .

      - name: Start backend container
        id: e2e-backend
        run: |
          CONTAINER="e2e-backend-${{ github.run_id }}"
          docker rm -f "$CONTAINER" 2>/dev/null || true
          docker run -d --name "$CONTAINER" -P \
            -e CORS_ORIGINS="*" \
            varuna-backend:e2e-test
          PORT=$(docker port "$CONTAINER" 8000/tcp | head -1 | cut -d: -f2)
          echo "port=$PORT" >> "$GITHUB_OUTPUT"

      - name: Wait for backend healthy
        run: |
          PORT=${{ steps.e2e-backend.outputs.port }}
          for i in $(seq 1 30); do
            if curl -sf "http://localhost:$PORT/api/health" > /dev/null 2>&1; then
              echo "Backend is healthy on port $PORT"
              exit 0
            fi
            echo "Waiting for backend... ($i/30)"
            sleep 2
          done
          echo "Backend failed to start"
          docker logs "e2e-backend-${{ github.run_id }}"
          exit 1

      - name: Run Playwright tests
        run: |
          cd frontend
          npx playwright test --config=e2e/playwright.config.js --project=chromium
        env:
          CI: true
          BASE_URL: http://localhost:5173
          API_URL: http://localhost:${{ steps.e2e-backend.outputs.port }}

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: frontend/e2e/playwright-report/
          retention-days: 14

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-results
          path: frontend/e2e/test-results/
          retention-days: 7

      - name: Cleanup
        if: always()
        run: docker rm -f "e2e-backend-${{ github.run_id }}" 2>/dev/null || true

  # ============================================
  # CI Status Check (required for PR merge)
  # ============================================
  ci-status:
    name: CI Status
    needs:
      - changes
      - backend-lint
      - backend-test
      - backend-docker
      - frontend-lint
      - frontend-build
      - frontend-docker
      - integration
      - e2e
    runs-on: ${{ vars.USE_SELF_HOSTED == 'true' && 'self-hosted' || 'ubuntu-latest' }}
    if: always()

    steps:
      - name: Check CI results
        run: |
          if [ "${{ contains(needs.*.result, 'failure') }}" = "true" ]; then
            echo "One or more CI jobs failed"
            exit 1
          fi
          echo "All CI checks passed (skipped jobs are OK — path filtering)"
