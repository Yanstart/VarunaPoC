name: Security Scanning

on:
  # Run on every PR
  pull_request:
    branches: [main]

  # Run on push to main
  push:
    branches: [main]

  # Run daily at 2 AM UTC
  schedule:
    - cron: '0 2 * * *'

  # Allow manual trigger
  workflow_dispatch:

# Cancel in-progress runs for same PR/branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege default - each job overrides as needed
permissions:
  contents: read

jobs:
  # ============================================
  # Dependency Vulnerability Scanning
  # ============================================
  dependency-scan:
    name: Dependency Vulnerability Scan
    runs-on: ${{ vars.USE_SELF_HOSTED == 'true' && 'self-hosted' || 'ubuntu-latest' }}
    continue-on-error: true  # Informational - don't block PRs
    permissions:
      contents: read
      security-events: write  # Required for upload-sarif

    strategy:
      matrix:
        component: [backend, frontend]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner (dependencies)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: './${{ matrix.component }}'
          format: 'sarif'
          output: 'trivy-${{ matrix.component }}-results.sarif'
          severity: 'CRITICAL,HIGH,MEDIUM'
          exit-code: '0' # Don't fail on vulnerabilities (just report)

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        continue-on-error: true  # Graceful if code scanning not fully configured
        with:
          sarif_file: 'trivy-${{ matrix.component }}-results.sarif'
          category: 'trivy-${{ matrix.component }}'

      - name: Generate vulnerability report
        if: always()
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: './${{ matrix.component }}'
          format: 'table'
          severity: 'CRITICAL,HIGH,MEDIUM'

  # ============================================
  # Python Security (Backend)
  # ============================================
  python-security:
    name: Python Security Scan
    runs-on: ${{ vars.USE_SELF_HOSTED == 'true' && 'self-hosted' || 'ubuntu-latest' }}
    continue-on-error: true  # Informational - don't block PRs
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install bandit safety pip-audit

      - name: Run Bandit (Python security linter)
        run: |
          cd backend
          bandit -r . --exclude ./tests -f json -o bandit-report.json || true
          bandit -r . --exclude ./tests -f screen || true

      - name: Run Safety (dependency vulnerability check)
        run: |
          cd backend
          safety check --json --file=requirements.txt || true
          safety check --file=requirements.txt || true

      - name: Run pip-audit (dependency audit)
        run: |
          cd backend
          pip-audit --requirement requirements.txt --format json --output pip-audit-report.json || true
          pip-audit --requirement requirements.txt || true

      - name: Upload security reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: python-security-reports
          path: |
            backend/bandit-report.json
            backend/pip-audit-report.json
          retention-days: 30

  # ============================================
  # JavaScript Security (Frontend)
  # ============================================
  javascript-security:
    name: JavaScript Security Scan
    runs-on: ${{ vars.USE_SELF_HOSTED == 'true' && 'self-hosted' || 'ubuntu-latest' }}
    continue-on-error: true  # Informational - don't block PRs
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Run npm audit
        run: |
          cd frontend
          npm audit --json > npm-audit-report.json || true
          npm audit --audit-level=high || true

      - name: Upload npm audit report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: npm-audit-report
          path: frontend/npm-audit-report.json
          retention-days: 30

  # ============================================
  # Docker Image Scanning
  # ============================================
  docker-scan:
    name: Docker Image Security Scan
    runs-on: ${{ vars.USE_SELF_HOSTED == 'true' && 'self-hosted' || 'ubuntu-latest' }}
    continue-on-error: true  # Informational - don't block PRs
    permissions:
      contents: read
      security-events: write  # Required for upload-sarif

    strategy:
      matrix:
        component: [backend, frontend]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.component }}
          file: ./${{ matrix.component }}/Dockerfile
          push: false
          load: true
          tags: varuna-${{ matrix.component }}:security-scan
          cache-from: type=local,src=/data/VarunaPoC/.buildx-cache/${{ matrix.component }}
          cache-to: type=local,dest=/data/VarunaPoC/.buildx-cache-new/${{ matrix.component }},mode=max

      - name: Run Trivy vulnerability scanner (Docker image)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'varuna-${{ matrix.component }}:security-scan'
          format: 'sarif'
          output: 'trivy-docker-${{ matrix.component }}.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

      - name: Upload Docker scan results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        continue-on-error: true  # Graceful if code scanning not fully configured
        with:
          sarif_file: 'trivy-docker-${{ matrix.component }}.sarif'
          category: 'trivy-docker-${{ matrix.component }}'

      - name: Generate Docker image vulnerability report
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'varuna-${{ matrix.component }}:security-scan'
          format: 'table'
          severity: 'CRITICAL,HIGH,MEDIUM'

      - name: Rotate Docker build cache
        if: always()
        run: |
          rm -rf /data/VarunaPoC/.buildx-cache/${{ matrix.component }}
          mv /data/VarunaPoC/.buildx-cache-new/${{ matrix.component }} /data/VarunaPoC/.buildx-cache/${{ matrix.component }} 2>/dev/null || true

  # ============================================
  # Code Quality & SAST
  # ============================================
  codeql-analysis:
    name: CodeQL Analysis
    runs-on: ${{ vars.USE_SELF_HOSTED == 'true' && 'self-hosted' || 'ubuntu-latest' }}
    continue-on-error: true  # Informational - don't block PRs
    permissions:
      security-events: write
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        language: ['python', 'javascript']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: +security-extended,security-and-quality

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        continue-on-error: true  # Requires GitHub Advanced Security (not available on private repos without it)
        with:
          category: "/language:${{ matrix.language }}"

  # ============================================
  # Secret Scanning (CRITICAL - blocks PRs)
  # ============================================
  secret-scan:
    name: Secret Scanning
    runs-on: ${{ vars.USE_SELF_HOSTED == 'true' && 'self-hosted' || 'ubuntu-latest' }}
    # No continue-on-error: secret leaks MUST block merges
    permissions:
      contents: read
      pull-requests: read  # Required for Gitleaks to access PR commits API

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Full history for comprehensive scan

      - name: Run Gitleaks (secret scanner)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false
          GITLEAKS_ENABLE_SUMMARY: true

  # ============================================
  # HIPAA/GDPR Compliance Checks (CRITICAL - blocks PRs)
  # ============================================
  compliance-check:
    name: HIPAA/GDPR Compliance Check
    runs-on: ${{ vars.USE_SELF_HOSTED == 'true' && 'self-hosted' || 'ubuntu-latest' }}
    # No continue-on-error: compliance violations MUST block merges
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check for sensitive data patterns
        run: |
          echo "Scanning for sensitive data patterns (PHI, PII)..."

          # Check for potential patient identifiers (actual PHI, not code variable names)
          # Exclude: fhir (FHIR field names), tests, node_modules,
          # models/routes/quality/auth/migrations (use patient_id as DB column, not PHI),
          # hl7* (HL7v2/FHIR parsers reference standard field names like PID-19:SSN by definition)
          echo "Checking for patient identifiers..."
          ! grep -r -E "(SSN|social.?security|medical.?record)" \
            --include="*.py" --include="*.js" \
            --exclude-dir=fhir --exclude-dir=tests --exclude-dir=node_modules \
            --exclude-dir=models --exclude-dir=routes --exclude-dir=quality \
            --exclude-dir=auth --exclude-dir=migrations \
            --exclude="*hl7*" . || \
            (echo "WARNING: Potential PHI detected" && exit 1)

          # Check for hardcoded secrets (exclude test files, config examples, and pragma-allowed)
          # Exclude: fhir (uses standard OAuth2/SMART field names like token_endpoint)
          echo "Checking for hardcoded secrets..."
          ! grep -r -E "(password|api.?key|secret|token).*=.*['\"][^'\"]{8,}" \
            --include="*.py" --include="*.js" \
            --exclude-dir=tests --exclude-dir=__tests__ --exclude-dir=node_modules \
            --exclude-dir=fhir \
            --exclude="*.test.*" --exclude="*.spec.*" . | \
            grep -v "pragma: allowlist secret" | \
            grep -v "logger\.\|logging\.\|log\.\|print(" || \
            (echo "WARNING: Potential hardcoded secrets" && exit 1)

          # Check for insecure HTTP usage (require HTTPS)
          # Uses pipe filtering instead of PCRE lookahead for portability
          # Allowlist: localhost, Docker services, standard URIs (SNOMED, HL7, W3C, FHIR examples, UCUM)
          echo "Checking for insecure HTTP usage..."
          ! grep -r "http://" \
            --include="*.py" --include="*.js" \
            --exclude-dir=tests --exclude-dir=node_modules --exclude-dir=fhir \
            --exclude-dir=keycloak --exclude-dir=.github . | \
            grep -v "localhost\|127\.0\.0\.1\|backend\|frontend\|prometheus\|keycloak\|varuna_\|varuna\.local" | \
            grep -v "hl7\.org\|hl7\.jp\|loinc\.org\|terminology\.hl7\|schemas\.xmlsoap" | \
            grep -v "snomed\.info\|unitsofmeasure\.org\|hospital\.example" | \
            grep -v "w3\.org" || \
            (echo "WARNING: Insecure HTTP usage detected" && exit 1)

          echo "Compliance checks passed"

      - name: Verify CORS configuration
        run: |
          echo "Verifying CORS is properly configured..."
          grep -q "CORSMiddleware" backend/main.py || \
            (echo "ERROR: CORS middleware not found" && exit 1)
          echo "CORS configuration verified"

      - name: Check for medical data logging
        run: |
          echo "Checking for potential medical data logging..."
          ! grep -r -E "(logger|print|console\.log).*slide.*patient" \
            --include="*.py" --include="*.js" . || \
            (echo "WARNING: Potential PHI logging detected" && exit 1)
          echo "No PHI logging detected"

  # ============================================
  # Security Summary
  # ============================================
  security-summary:
    name: Security Summary
    needs:
      - dependency-scan
      - python-security
      - javascript-security
      - docker-scan
      - codeql-analysis
      - secret-scan
      - compliance-check
    runs-on: ${{ vars.USE_SELF_HOSTED == 'true' && 'self-hosted' || 'ubuntu-latest' }}
    if: always()
    permissions:
      contents: read

    steps:
      - name: Generate security summary
        run: |
          cat >> $GITHUB_STEP_SUMMARY <<EOF
          # Security Scan Summary

          ## Scan Results

          | Component | Status |
          |-----------|--------|
          | Dependency Scan | ${{ needs.dependency-scan.result }} |
          | Python Security | ${{ needs.python-security.result }} |
          | JavaScript Security | ${{ needs.javascript-security.result }} |
          | Docker Scan | ${{ needs.docker-scan.result }} |
          | CodeQL Analysis | ${{ needs.codeql-analysis.result }} |
          | Secret Scan | ${{ needs.secret-scan.result }} |
          | HIPAA/GDPR Compliance | ${{ needs.compliance-check.result }} |

          ## Security Resources

          - [Security Advisories](https://github.com/${{ github.repository }}/security/advisories)
          - [Dependabot Alerts](https://github.com/${{ github.repository }}/security/dependabot)
          - [Code Scanning Alerts](https://github.com/${{ github.repository }}/security/code-scanning)

          ## Medical Data Compliance

          This project handles sensitive medical imaging data (WSI files). All security findings should be reviewed with HIPAA/GDPR compliance in mind.
          EOF

      - name: Check for critical failures
        if: |
          needs.secret-scan.result == 'failure' ||
          needs.compliance-check.result == 'failure'
        run: |
          echo "::error::Critical security checks failed - review required before merging"
          if [ "${{ needs.secret-scan.result }}" = "failure" ]; then
            echo "::error::Secret scanning found potential leaks - review immediately"
          fi
          if [ "${{ needs.compliance-check.result }}" = "failure" ]; then
            echo "::error::HIPAA/GDPR compliance check failed - review immediately"
          fi
          exit 1
