# Self-hosted GitHub Actions runner stack
# Usage:
#   cp .env.example .env  # then fill in ACCESS_TOKEN
#   docker compose up -d
#   docker compose logs -f github-runner
#
# Scale runners for parallel jobs:
#   RUNNER_REPLICAS=4 in .env (default: 4)

services:
  github-runner:
    image: myoung34/github-runner:latest
    restart: unless-stopped
    environment:
      REPO_URL: ${REPO_URL:-https://github.com/Yanstart/VarunaPoC}
      ACCESS_TOKEN: ${ACCESS_TOKEN:?ACCESS_TOKEN is required - GitHub PAT with repo scope}
      RUNNER_WORKDIR: /data/runner-work
      LABELS: self-hosted,linux,x64,varuna
      DISABLE_AUTO_UPDATE: "true"
      TMPDIR: /data/runner-tmp
      DOCKER_BUILDKIT: "1"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /data:/data
    deploy:
      replicas: ${RUNNER_REPLICAS:-4}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  registry:
    image: registry:2
    restart: unless-stopped
    ports:
      - "5000:5000"
    volumes:
      - registry-data:/var/lib/registry
    environment:
      REGISTRY_STORAGE_DELETE_ENABLED: "true"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  registry-data:
