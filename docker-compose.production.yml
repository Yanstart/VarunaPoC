# VarunaPoC - Unified Production Docker Compose
# Self-contained deployment for hospital environments
#
# Usage:
#   # Core services only
#   docker compose -f docker-compose.production.yml --env-file .env.production up -d
#
#   # With authentication (Keycloak)
#   docker compose -f docker-compose.production.yml --env-file .env.production --profile auth up -d
#
#   # With monitoring (Prometheus + Grafana + Alertmanager)
#   docker compose -f docker-compose.production.yml --env-file .env.production --profile monitoring up -d
#
#   # Full stack
#   docker compose -f docker-compose.production.yml --env-file .env.production --profile auth --profile monitoring up -d

# ==============================================================================
# SECRETS
# Docker Secrets provide credentials as read-only files at /run/secrets/{name}
# inside the container.  The backend resolves them via backend.core.secrets.get_secret().
#
# Before deploying, create the secret files on the host (never commit them):
#   mkdir -p ./secrets && chmod 700 ./secrets
#   printf 'your-db-password'    > ./secrets/db_password.txt    && chmod 600 ./secrets/db_password.txt
#   printf 'your-redis-password' > ./secrets/redis_password.txt && chmod 600 ./secrets/redis_password.txt
#
# See docs/Deployment/SECRETS_MANAGEMENT.md for the full migration guide.
# ==============================================================================
secrets:
  db_password:
    file: ./secrets/db_password.txt
  redis_password:
    file: ./secrets/redis_password.txt

# ==============================================================================
# LOGGING ANCHORS - Docker log rotation to prevent disk exhaustion
# ==============================================================================
x-logging-default: &logging-default
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"

x-logging-high-volume: &logging-high-volume
  logging:
    driver: json-file
    options:
      max-size: "50m"
      max-file: "10"

x-logging-medium: &logging-medium
  logging:
    driver: json-file
    options:
      max-size: "20m"
      max-file: "5"

x-logging-low-volume: &logging-low-volume
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

x-logging-oneshot: &logging-oneshot
  logging:
    driver: json-file
    options:
      max-size: "5m"
      max-file: "2"

services:
  # ============================================================================
  # DATABASE - PostgreSQL + PostGIS
  # Example of Docker Secrets usage: db_password is mounted at
  # /run/secrets/db_password instead of being passed as a plaintext env var.
  # The POSTGRES_PASSWORD_FILE variable tells the official postgres image to
  # read the password from a file rather than from POSTGRES_PASSWORD.
  # ============================================================================
  db:
    image: postgis/postgis@sha256:44126d872ac91993766c341e369c539e8196614321765d36a6f1bab0419a5fa5 # postgis/postgis:16-3.4
    <<: *logging-default
    secrets:
      - db_password
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-varuna}
      POSTGRES_USER: ${POSTGRES_USER:-varuna}
      # Read password from the mounted secret file (official postgres image convention)
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    volumes:
      - varuna-db-data:/var/lib/postgresql/data
    networks:
      - varuna-production-network
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-varuna} -d ${POSTGRES_DB:-varuna}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

  # ============================================================================
  # DATABASE MIGRATION (init container - runs once then exits)
  # ============================================================================
  migration:
    image: ${BACKEND_IMAGE:-ghcr.io/yanstart/varunapoc/backend}:${BACKEND_IMAGE_TAG:-main}
    <<: *logging-oneshot
    command: python -m alembic upgrade head
    secrets:
      - db_password
    environment:
      # Password is NOT embedded here. core/secrets.py reads /run/secrets/db_password
      # and the backend constructs the full DATABASE_URL at startup.
      DATABASE_URL: "postgresql+asyncpg://${POSTGRES_USER:-varuna}@db:5432/${POSTGRES_DB:-varuna}"
      DATABASE_PASSWORD_FILE: /run/secrets/db_password
    depends_on:
      db:
        condition: service_healthy
    networks:
      - varuna-production-network
    restart: "no"
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  # ============================================================================
  # REDIS CACHE
  # ============================================================================
  redis:
    image: redis@sha256:8b81dd37ff027bec4e516d41acfbe9fe2460070dc6d4a4570a2ac5b9d59df065 # redis:7-alpine
    <<: *logging-default
    # NOTE: Redis does not natively support Docker Secrets file-based passwords.
    # REDIS_PASSWORD must be set in .env.production until a custom entrypoint is added
    # that reads /run/secrets/redis_password and passes it to redis-server at startup.
    # The redis_password secret is declared at the top of this file for future use.
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env.production}
      --maxmemory ${REDIS_MAX_MEMORY:-4gb}
      --maxmemory-policy allkeys-lru
      --save ""
      --appendonly no
      --tcp-backlog 511
      --tcp-keepalive 300
      --timeout 0
    volumes:
      - redis-data:/data
    networks:
      - varuna-production-network
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 4.5G
        reservations:
          cpus: '0.5'
          memory: 4G

  # ============================================================================
  # BACKEND API (replicated)
  # ============================================================================
  backend:
    image: ${BACKEND_IMAGE:-ghcr.io/yanstart/varunapoc/backend}:${BACKEND_IMAGE_TAG:-main}
    <<: *logging-high-volume
    secrets:
      - db_password
    expose:
      - "8000"
    volumes:
      - ${SLIDES_HOST_PATH:-/mnt/chu-slides}:/slides:ro
      - backend-logs:/app/logs
    environment:
      # Password is NOT embedded here. core/secrets.py reads /run/secrets/db_password
      # and the backend constructs the full DATABASE_URL at startup.
      DATABASE_URL: "postgresql+asyncpg://${POSTGRES_USER:-varuna}@db:5432/${POSTGRES_DB:-varuna}"
      DATABASE_PASSWORD_FILE: /run/secrets/db_password
      REDIS_URL: redis://:${REDIS_PASSWORD:?}@redis:6379
      SLIDES_REPOSITORY_PATH: /slides
      LOG_LEVEL: ${LOG_LEVEL:-info}
      UVICORN_WORKERS: ${UVICORN_WORKERS:-1}
      CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS is required}
      AUTH_ENABLED: ${AUTH_ENABLED:-true}
      OIDC_ISSUER_URL: ${OIDC_ISSUER_URL:-http://keycloak:8080/realms/varuna}
      ML_ENABLED: ${ML_ENABLED:-true}
      ML_PROVIDER: ${ML_PROVIDER:-slideflow}
      PYTHONUNBUFFERED: 1
    depends_on:
      migration:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks:
      - varuna-production-network
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      replicas: ${BACKEND_REPLICAS:-2}
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
        reservations:
          cpus: '1.0'
          memory: 2G

  # ============================================================================
  # FRONTEND (static SPA served by built-in nginx)
  # ============================================================================
  frontend:
    image: ${FRONTEND_IMAGE:-ghcr.io/yanstart/varunapoc/frontend}:${FRONTEND_IMAGE_TAG:-main}
    <<: *logging-low-volume
    expose:
      - "80"
    networks:
      - varuna-production-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:80/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M

  # ============================================================================
  # REVERSE PROXY + LOAD BALANCER
  # ============================================================================
  nginx:
    image: nginx@sha256:516475cc129da42866742567714ddc681e5eed7b9ee0b9e9c015e464b4221a00 # nginx:1.25-alpine
    <<: *logging-high-volume
    entrypoint: ["/docker-entrypoint-varuna.sh"]
    environment:
      NGINX_SERVER_NAME: ${NGINX_SERVER_NAME:-localhost}
      NGINX_SSL_CERT: ${NGINX_SSL_CERT:-/etc/nginx/ssl/varuna.crt}
      NGINX_SSL_KEY: ${NGINX_SSL_KEY:-/etc/nginx/ssl/varuna.key}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf.template:ro
      - ./nginx/docker-entrypoint.sh:/docker-entrypoint-varuna.sh:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - nginx-cache:/var/cache/nginx
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    networks:
      - varuna-production-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M

  # ============================================================================
  # KEYCLOAK DATABASE (auth profile)
  # ============================================================================
  keycloak-db:
    image: postgres@sha256:20edbde7749f822887a1a022ad526fde0a47d6b2be9a8364433605cf65099416 # postgres:16-alpine
    <<: *logging-default
    profiles: ["auth"]
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?KEYCLOAK_DB_PASSWORD is required}
    volumes:
      - keycloak-db-data:/var/lib/postgresql/data
    networks:
      - varuna-auth-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M

  # ============================================================================
  # KEYCLOAK OIDC PROVIDER (auth profile)
  # ============================================================================
  keycloak:
    image: quay.io/keycloak/keycloak@sha256:14e99d6f5dd0516a5bdc82537b732cb85469ecdb15ad7fe5f11ff67521544db8 # quay.io/keycloak/keycloak:23.0
    <<: *logging-medium
    profiles: ["auth"]
    command: start --optimized --import-realm
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?KEYCLOAK_ADMIN_PASSWORD is required}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?KEYCLOAK_DB_PASSWORD is required}
      KC_HTTP_PORT: 8080
      KC_HEALTH_ENABLED: "true"
      KC_HTTP_ENABLED: "true"
      # HTTPS enforcement: Keycloak runs HTTP internally, nginx terminates TLS
      KC_PROXY: edge
      KC_HOSTNAME: ${KEYCLOAK_HOSTNAME:-keycloak}
      KC_HOSTNAME_STRICT_HTTPS: "true"
    ports:
      - "127.0.0.1:8180:8080"
    volumes:
      - ./backend/keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    depends_on:
      keycloak-db:
        condition: service_healthy
    networks:
      - varuna-production-network
      - varuna-auth-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "timeout 1 bash -c 'cat < /dev/tcp/localhost/8080' 2>/dev/null || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 15
      start_period: 90s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M

  # ============================================================================
  # PROMETHEUS (monitoring profile)
  # ============================================================================
  prometheus:
    image: prom/prometheus@sha256:a67e5e402ff5410b86ec48b39eab1a3c4df2a7e78a71bf025ec5e32e09090ad4 # prom/prometheus:v2.48.1
    <<: *logging-low-volume
    profiles: ["monitoring"]
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      # --web.enable-lifecycle removed: exposes unauthenticated /-/reload and /-/quit
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts:/etc/prometheus/alerts:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      alertmanager:
        condition: service_healthy
    networks:
      - varuna-production-network
      - varuna-monitoring-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M

  # ============================================================================
  # GRAFANA (monitoring profile)
  # ============================================================================
  grafana:
    image: grafana/grafana@sha256:6b5b37eb35bbf30e7f64bd7f0fd41c0a5b7637f65d3bf93223b04a192b8bf3e2 # grafana/grafana:10.2.3
    <<: *logging-low-volume
    profiles: ["monitoring"]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD is required}
      GF_INSTALL_PLUGINS: redis-datasource
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost:3000}
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      prometheus:
        condition: service_healthy
    networks:
      - varuna-production-network
      - varuna-monitoring-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M

  # ============================================================================
  # REDIS EXPORTER (monitoring profile)
  # ============================================================================
  redis-exporter:
    image: oliver006/redis_exporter@sha256:89d612c22490b29a31edde7e4c1f18d13b63c36150bb9ea6d155887fab063723 # oliver006/redis_exporter:v1.55.0-alpine
    <<: *logging-low-volume
    profiles: ["monitoring"]
    command:
      - '--redis.addr=redis:6379'
      - '--redis.password=${REDIS_PASSWORD:?REDIS_PASSWORD is required}'
    expose:
      - "9121"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - varuna-production-network
      - varuna-monitoring-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
        reservations:
          cpus: '0.1'
          memory: 32M

  # ============================================================================
  # ALERTMANAGER (monitoring profile)
  # ============================================================================
  alertmanager:
    # TODO: pin to SHA digest once confirmed in your registry: docker pull prom/alertmanager:v0.26.0 && docker inspect --format='{{index .RepoDigests 0}}' prom/alertmanager:v0.26.0
    image: prom/alertmanager:v0.26.0
    profiles: ["monitoring"]
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    volumes:
      - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - ./monitoring/alert-templates.tmpl:/etc/alertmanager/alert-templates.tmpl:ro
      - alertmanager-data:/alertmanager
    ports:
      - "127.0.0.1:9093:9093"
    networks:
      - varuna-monitoring-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9093/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M

  # ============================================================================
  # NGINX EXPORTER (monitoring profile)
  # ============================================================================
  nginx-exporter:
    image: nginx/nginx-prometheus-exporter@sha256:36dc92d75ab040f2bda0362c3803165a40bab47a16e1197afd43d5acc96407fa # nginx/nginx-prometheus-exporter:1.0.0
    <<: *logging-low-volume
    profiles: ["monitoring"]
    command:
      - '-nginx.scrape-uri=http://nginx:80/nginx_status'
    expose:
      - "9113"
    depends_on:
      nginx:
        condition: service_healthy
    networks:
      - varuna-production-network
      - varuna-monitoring-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
        reservations:
          cpus: '0.1'
          memory: 32M

  # ============================================================================
  # NODE EXPORTER (monitoring profile)
  # ============================================================================
  node-exporter:
    # TODO: pin to SHA digest: docker pull prom/node-exporter:v1.7.0 && docker inspect --format='{{index .RepoDigests 0}}' prom/node-exporter:v1.7.0
    image: prom/node-exporter:v1.7.0
    profiles: ["monitoring"]
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    networks:
      - varuna-monitoring-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
        reservations:
          cpus: '0.1'
          memory: 32M

  # ============================================================================
  # CADVISOR (monitoring profile)
  # ============================================================================
  cadvisor:
    # TODO: pin to SHA digest: docker pull gcr.io/cadvisor/cadvisor:v0.47.0 && docker inspect --format='{{index .RepoDigests 0}}' gcr.io/cadvisor/cadvisor:v0.47.0
    image: gcr.io/cadvisor/cadvisor:v0.47.0
    profiles: ["monitoring"]
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
    networks:
      - varuna-monitoring-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M

# ==============================================================================
# NETWORKS
# ==============================================================================
networks:
  varuna-production-network:
    driver: bridge
    name: varuna-production-network
  varuna-auth-network:
    driver: bridge
    internal: true
    name: varuna-auth-network
  varuna-monitoring-network:
    driver: bridge
    internal: true
    name: varuna-monitoring-network

# ==============================================================================
# VOLUMES
# ==============================================================================
volumes:
  varuna-db-data:
    driver: local
  redis-data:
    driver: local
  backend-logs:
    driver: local
  nginx-cache:
    driver: local
  keycloak-db-data:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local
  alertmanager-data:
    driver: local
