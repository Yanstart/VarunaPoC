# VarunaPoC - Unified Production Docker Compose
# Self-contained deployment for hospital environments
#
# Usage:
#   # Core services only
#   docker compose -f docker-compose.production.yml --env-file .env.production up -d
#
#   # With authentication (Keycloak)
#   docker compose -f docker-compose.production.yml --env-file .env.production --profile auth up -d
#
#   # With monitoring (Prometheus + Grafana)
#   docker compose -f docker-compose.production.yml --env-file .env.production --profile monitoring up -d
#
#   # Full stack
#   docker compose -f docker-compose.production.yml --env-file .env.production --profile auth --profile monitoring up -d

# ==============================================================================
# LOGGING ANCHORS - Docker log rotation to prevent disk exhaustion
# ==============================================================================
x-logging-default: &logging-default
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"

x-logging-high-volume: &logging-high-volume
  logging:
    driver: json-file
    options:
      max-size: "50m"
      max-file: "10"

x-logging-medium: &logging-medium
  logging:
    driver: json-file
    options:
      max-size: "20m"
      max-file: "5"

x-logging-low-volume: &logging-low-volume
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

x-logging-oneshot: &logging-oneshot
  logging:
    driver: json-file
    options:
      max-size: "5m"
      max-file: "2"

services:
  # ============================================================================
  # DATABASE - PostgreSQL + PostGIS
  # ============================================================================
  db:
    image: postgis/postgis:16-3.4
    <<: *logging-default
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-varuna}
      POSTGRES_USER: ${POSTGRES_USER:-varuna}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - varuna-db-data:/var/lib/postgresql/data
    networks:
      - varuna-production-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-varuna} -d ${POSTGRES_DB:-varuna}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

  # ============================================================================
  # DATABASE MIGRATION (init container - runs once then exits)
  # ============================================================================
  migration:
    image: ${BACKEND_IMAGE:-ghcr.io/yanstart/varunapoc/backend}:${BACKEND_IMAGE_TAG:-main}
    <<: *logging-oneshot
    command: python -m alembic upgrade head
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-varuna}:${POSTGRES_PASSWORD:?}@db:5432/${POSTGRES_DB:-varuna}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - varuna-production-network
    restart: "no"
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  # ============================================================================
  # REDIS CACHE
  # ============================================================================
  redis:
    image: redis:7-alpine
    <<: *logging-default
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      --maxmemory ${REDIS_MAX_MEMORY:-4gb}
      --maxmemory-policy allkeys-lru
      --save ""
      --appendonly no
      --tcp-backlog 511
      --tcp-keepalive 300
      --timeout 0
    volumes:
      - redis-data:/data
    networks:
      - varuna-production-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 4.5G
        reservations:
          cpus: '0.5'
          memory: 4G

  # ============================================================================
  # BACKEND API (replicated)
  # ============================================================================
  backend:
    image: ${BACKEND_IMAGE:-ghcr.io/yanstart/varunapoc/backend}:${BACKEND_IMAGE_TAG:-main}
    <<: *logging-high-volume
    expose:
      - "8000"
    volumes:
      - ${SLIDES_HOST_PATH:-/mnt/chu-slides}:/slides:ro
      - backend-logs:/app/logs
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-varuna}:${POSTGRES_PASSWORD:?}@db:5432/${POSTGRES_DB:-varuna}
      REDIS_URL: redis://:${REDIS_PASSWORD:?}@redis:6379
      SLIDES_REPOSITORY_PATH: /slides
      LOG_LEVEL: ${LOG_LEVEL:-info}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      AUTH_ENABLED: ${AUTH_ENABLED:-false}
      OIDC_ISSUER_URL: ${OIDC_ISSUER_URL:-http://keycloak:8080/realms/varuna}
      ML_ENABLED: ${ML_ENABLED:-true}
      ML_PROVIDER: ${ML_PROVIDER:-slideflow}
      PYTHONUNBUFFERED: 1
    depends_on:
      migration:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks:
      - varuna-production-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      replicas: ${BACKEND_REPLICAS:-2}
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
        reservations:
          cpus: '1.0'
          memory: 2G

  # ============================================================================
  # FRONTEND (static SPA served by built-in nginx)
  # ============================================================================
  frontend:
    image: ${FRONTEND_IMAGE:-ghcr.io/yanstart/varunapoc/frontend}:${FRONTEND_IMAGE_TAG:-main}
    <<: *logging-low-volume
    expose:
      - "80"
    networks:
      - varuna-production-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:80/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M

  # ============================================================================
  # REVERSE PROXY + LOAD BALANCER
  # ============================================================================
  nginx:
    image: nginx:1.25-alpine
    <<: *logging-high-volume
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - nginx-cache:/var/cache/nginx
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    networks:
      - varuna-production-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M

  # ============================================================================
  # KEYCLOAK DATABASE (auth profile)
  # ============================================================================
  keycloak-db:
    image: postgres:16-alpine
    <<: *logging-default
    profiles: ["auth"]
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?KEYCLOAK_DB_PASSWORD is required}
    volumes:
      - keycloak-db-data:/var/lib/postgresql/data
    networks:
      - keycloak-internal
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M

  # ============================================================================
  # KEYCLOAK OIDC PROVIDER (auth profile)
  # ============================================================================
  keycloak:
    image: quay.io/keycloak/keycloak:23.0
    <<: *logging-medium
    profiles: ["auth"]
    command: start --optimized --import-realm
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?KEYCLOAK_ADMIN_PASSWORD is required}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?KEYCLOAK_DB_PASSWORD is required}
      KC_HTTP_PORT: 8080
      KC_HEALTH_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
    ports:
      - "8180:8080"
    volumes:
      - ./backend/keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    depends_on:
      keycloak-db:
        condition: service_healthy
    networks:
      - varuna-production-network
      - keycloak-internal
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "timeout 1 bash -c 'cat < /dev/tcp/localhost/8080' 2>/dev/null || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 15
      start_period: 90s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M

  # ============================================================================
  # PROMETHEUS (monitoring profile)
  # ============================================================================
  prometheus:
    image: prom/prometheus:v2.48.1
    <<: *logging-low-volume
    profiles: ["monitoring"]
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts:/etc/prometheus/alerts:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - varuna-production-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M

  # ============================================================================
  # GRAFANA (monitoring profile)
  # ============================================================================
  grafana:
    image: grafana/grafana:10.2.3
    <<: *logging-low-volume
    profiles: ["monitoring"]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-}
      GF_INSTALL_PLUGINS: redis-datasource
      GF_SERVER_ROOT_URL: http://localhost:3000
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    networks:
      - varuna-production-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M

  # ============================================================================
  # REDIS EXPORTER (monitoring profile)
  # ============================================================================
  redis-exporter:
    image: oliver006/redis_exporter:v1.55.0-alpine
    <<: *logging-low-volume
    profiles: ["monitoring"]
    command:
      - '--redis.addr=redis:6379'
      - '--redis.password=${REDIS_PASSWORD:-}'
    expose:
      - "9121"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - varuna-production-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
        reservations:
          cpus: '0.1'
          memory: 32M

  # ============================================================================
  # NGINX EXPORTER (monitoring profile)
  # ============================================================================
  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.0.0
    <<: *logging-low-volume
    profiles: ["monitoring"]
    command:
      - '-nginx.scrape-uri=http://nginx:80/nginx_status'
    expose:
      - "9113"
    depends_on:
      nginx:
        condition: service_healthy
    networks:
      - varuna-production-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
        reservations:
          cpus: '0.1'
          memory: 32M

# ==============================================================================
# NETWORKS
# ==============================================================================
networks:
  varuna-production-network:
    driver: bridge
  keycloak-internal:
    driver: bridge
    internal: true

# ==============================================================================
# VOLUMES
# ==============================================================================
volumes:
  varuna-db-data:
    driver: local
  redis-data:
    driver: local
  backend-logs:
    driver: local
  nginx-cache:
    driver: local
  keycloak-db-data:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local
