# ==============================================================================
# VarunaPoC - Development Compose
# ==============================================================================
# Local development support services only (DB + Keycloak).
# Backend and frontend run locally via `uvicorn` and `npm run dev`.
# Auth is disabled by default: set AUTH_ENABLED=true in backend env to test OIDC.
# Production deployment: use docker-compose.production.yml with .env.production
# ==============================================================================

services:
  db:
    image: postgis/postgis:16-3.4
    container_name: varuna-db-dev
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: varuna
      POSTGRES_USER: varuna
      POSTGRES_PASSWORD: varuna_dev  # pragma: allowlist secret
    volumes:
      - varuna-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U varuna -d varuna"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - varuna-network

  # Keycloak IdP (Phase 3: Auth)
  keycloak-db:
    image: postgres:16-alpine
    container_name: varuna-keycloak-db
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak_dev  # pragma: allowlist secret
    volumes:
      - varuna-keycloak-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - varuna-network

  # Orthanc PACS - DICOM dev backend for the PACSWorkflowHook.
  # Two ports: 4242 (DICOM C-FIND/C-STORE/C-ECHO) and 8042 (HTTP REST API,
  # used as fallback for update_worklist which has no DIMSE-C equivalent).
  # AE Titles are env-driven (PACS_AET_LOCAL / PACS_AET_REMOTE) so the same
  # compose file works against any PACS vendor's allow-list.
  orthanc:
    image: orthancteam/orthanc:24.7.3
    container_name: varuna-orthanc-dev
    restart: unless-stopped
    ports:
      - "4242:4242"
      - "8042:8042"
    environment:
      ORTHANC__DICOM_PORT: 4242
      ORTHANC__HTTP_PORT: 8042
      ORTHANC__NAME: varuna-orthanc-dev
      ORTHANC__DICOM_AET: ${PACS_AET_REMOTE:-ORTHANC}
      ORTHANC__REGISTERED_USERS: '{"varuna": "varuna_dev"}'
      ORTHANC__REMOTE_ACCESS_ALLOWED: "true"
      ORTHANC__AUTHENTICATION_ENABLED: "true"
      ORTHANC__DICOM_MODALITIES: '{"varuna": ["${PACS_AET_LOCAL:-VARUNA_SCU}", "host.docker.internal", 4242]}'
    volumes:
      - varuna-orthanc-data:/var/lib/orthanc/db
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider --user=varuna --password=varuna_dev http://localhost:8042/system || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - varuna-network

  # HAPI FHIR R4 - dev/test backend for the FHIRWorkflowHook (DPI integration).
  # Uses embedded H2 storage so no extra DB container is needed for the demo.
  # In production, point FHIR_BASE_URL at the hospital's real FHIR server
  # instead of running this container. Cold start ~30-45s (start_period=60s).
  hapi-fhir:
    image: hapiproject/hapi:v7.4.0
    container_name: varuna-hapi-fhir-dev
    restart: unless-stopped
    ports:
      - "8090:8080"
    environment:
      hapi.fhir.fhir_version: R4
      hapi.fhir.default_encoding: json
      hapi.fhir.allow_external_references: "true"
      hapi.fhir.allow_multiple_delete: "true"
      spring.datasource.url: jdbc:h2:file:/data/h2;DB_CLOSE_DELAY=-1
      spring.jpa.properties.hibernate.dialect: ca.uhn.fhir.jpa.model.dialect.HapiFhirH2Dialect
    volumes:
      - varuna-hapi-data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/fhir/metadata"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - varuna-network

  # Redis - L2 distributed tile cache (TileCache Protocol implementer)
  # Host port 6380 to avoid conflict with a possible local Redis on 6379.
  # Production uses port 6379; see docker-compose.production.yml.
  redis:
    image: redis:7-alpine
    container_name: varuna-redis-dev
    restart: unless-stopped
    ports:
      - "6380:6379"
    command: ["redis-server", "--save", "60", "1000", "--appendonly", "yes"]
    volumes:
      - varuna-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - varuna-network

  keycloak:
    image: quay.io/keycloak/keycloak:23.0
    container_name: varuna-keycloak
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin  # pragma: allowlist secret
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak_dev  # pragma: allowlist secret
      KC_HTTP_PORT: 8080
      KC_HEALTH_ENABLED: "true"
    ports:
      - "8180:8080"
    volumes:
      - ./backend/keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    depends_on:
      keycloak-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/8080 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && timeout 2 grep -q '\"UP\"' <&3"]
      interval: 15s
      timeout: 10s
      retries: 15
      start_period: 90s
    networks:
      - varuna-network

networks:
  varuna-network:
    driver: bridge
    name: varuna-dev-network

volumes:
  varuna-db-data:
    name: varuna-db-dev-data
  varuna-keycloak-db-data:
    name: varuna-keycloak-db-data
  varuna-redis-data:
    name: varuna-redis-dev-data
  varuna-hapi-data:
    name: varuna-hapi-fhir-dev-data
  varuna-orthanc-data:
    name: varuna-orthanc-dev-data
