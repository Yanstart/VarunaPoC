# VarunaPoC - Nginx Configuration (Production-Ready)
# Features: Load balancing, HTTP/2, caching, security headers
# Version: 1.0
# Date: 2025-12-31

user nginx;
worker_processes auto;  # Auto-detect CPU cores
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;  # Support up to 4096 concurrent connections
    use epoll;  # Linux kernel optimization
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # ============================================================================
    # LOGGING
    # ============================================================================
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" '
                    'uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/access.log main;

    # ============================================================================
    # PERFORMANCE OPTIMIZATIONS
    # ============================================================================
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 100M;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1000;
    gzip_types text/plain text/css text/xml text/javascript
               application/json application/javascript application/xml+rss
               application/x-javascript;

    # ============================================================================
    # BACKEND UPSTREAM POOL
    # ============================================================================
    upstream varuna_backend {
        least_conn;  # Least connections algorithm (better for variable request times)

        # Backend instances (Compose DNS resolves to all replicas)
        server backend:8000 max_fails=3 fail_timeout=30s;

        # Keepalive connections to backend
        keepalive 32;
        keepalive_requests 100;
        keepalive_timeout 60s;
    }

    # ============================================================================
    # FRONTEND UPSTREAM POOL
    # ============================================================================
    upstream varuna_frontend {
        server frontend:80;
        keepalive 8;
    }

    # ============================================================================
    # TILE CACHE CONFIGURATION
    # ============================================================================
    proxy_cache_path /var/cache/nginx/tiles
                     levels=1:2
                     keys_zone=tile_cache:100m
                     max_size=10g
                     inactive=24h
                     use_temp_path=off;

    # ============================================================================
    # HTTP SERVER (REDIRECT TO HTTPS)
    # ============================================================================
    server {
        listen 80;
        server_name _;

        # Allow health checks on HTTP
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # Nginx status for monitoring
        location /nginx_status {
            stub_status on;
            access_log off;
            allow 172.28.0.0/16;  # Docker network
            deny all;
        }

        # Redirect all other traffic to HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ============================================================================
    # HTTPS SERVER (PRODUCTION)
    # ============================================================================
    server {
        listen 443 ssl http2;
        server_name varuna.chu-ucl.be;

        # SSL Configuration (TLS 1.3 only — cipher selection is managed by TLS 1.3)
        ssl_certificate /etc/nginx/ssl/varuna.crt;
        ssl_certificate_key /etc/nginx/ssl/varuna.key;
        ssl_protocols TLSv1.3;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        # Security headers
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; font-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

        # ========================================================================
        # FRONTEND (proxy to frontend container)
        # ========================================================================
        location / {
            proxy_pass http://varuna_frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        # ========================================================================
        # API ENDPOINTS (BACKEND)
        # ========================================================================
        location /api/ {
            proxy_pass http://varuna_backend;

            # Proxy headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # HTTP/1.1 for keepalive
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            # Timeouts (important for large slide operations)
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;

            # Buffering
            proxy_buffering on;
            proxy_buffer_size 128k;
            proxy_buffers 4 256k;
            proxy_busy_buffers_size 256k;

            # Disable caching for API calls (except tiles)
            proxy_cache off;
        }

        # ========================================================================
        # TILE ENDPOINTS (AGGRESSIVE CACHING)
        # ========================================================================
        location ~ ^/api/slides/[^/]+/tiles/ {
            proxy_pass http://varuna_backend;

            # Proxy headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # HTTP/1.1 for keepalive
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            # Cache configuration (CRITICAL FOR PERFORMANCE)
            proxy_cache tile_cache;
            proxy_cache_valid 200 24h;
            proxy_cache_key "$scheme$request_method$host$request_uri";
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
            proxy_cache_background_update on;
            proxy_cache_lock on;
            proxy_cache_lock_timeout 5s;

            # Cache bypass for testing
            # proxy_cache_bypass $http_cache_control;

            # Add cache status header (for debugging)
            add_header X-Cache-Status $upstream_cache_status;
            add_header X-Backend-Instance $upstream_addr;

            # Timeouts
            proxy_connect_timeout 30s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }

        # ========================================================================
        # PROMETHEUS METRICS (RESTRICTED)
        # ========================================================================
        location /metrics {
            proxy_pass http://varuna_backend;

            # Restrict to monitoring network only
            allow 172.28.0.0/16;  # Docker network
            deny all;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # ========================================================================
        # HEALTH CHECK
        # ========================================================================
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }
    }

    # ============================================================================
    # LOCAL DEVELOPMENT SERVER (HTTP ONLY)
    # ============================================================================
    server {
        listen 80;
        server_name localhost 127.0.0.1;

        # Frontend (proxy to frontend container)
        location / {
            proxy_pass http://varuna_frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        # API endpoints
        location /api/ {
            proxy_pass http://varuna_backend;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_http_version 1.1;
            proxy_set_header Connection "";

            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # Tile caching (same as HTTPS)
        location ~ ^/api/slides/[^/]+/tiles/ {
            proxy_pass http://varuna_backend;

            proxy_cache tile_cache;
            proxy_cache_valid 200 24h;
            proxy_cache_key "$scheme$request_method$host$request_uri";
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;

            add_header X-Cache-Status $upstream_cache_status;
            add_header X-Backend-Instance $upstream_addr;

            proxy_set_header Host $host;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        # Health check
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # Nginx status
        location /nginx_status {
            stub_status on;
            access_log off;
        }
    }
}
