# VarunaPoC - Nginx Configuration (Production-Ready)
# Features: Load balancing, HTTP/2, caching, security headers
# Version: 1.0
# Date: 2025-12-31

user nginx;
worker_processes auto;  # Auto-detect CPU cores
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;  # Support up to 4096 concurrent connections
    use epoll;  # Linux kernel optimization
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # ============================================================================
    # LOGGING
    # ============================================================================
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" '
                    'uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/access.log main;

    # ============================================================================
    # RATE LIMITING
    # ============================================================================
    # Tile requests: 100 req/s per IP, burst up to 200
    limit_req_zone $binary_remote_addr zone=tiles:10m rate=100r/s;
    # API requests: 30 req/s per IP, burst up to 60
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
    # Return 429 Too Many Requests (not default 503)
    limit_req_status 429;

    # ============================================================================
    # PERFORMANCE OPTIMIZATIONS
    # ============================================================================
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 100M;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1000;
    gzip_types text/plain text/css text/xml text/javascript
               application/json application/javascript application/xml+rss
               application/x-javascript;

    # ============================================================================
    # BACKEND UPSTREAM POOL
    # ============================================================================
    upstream varuna_backend {
        least_conn;  # Least connections algorithm (better for variable request times)

        # Backend instances (Compose DNS resolves to all replicas)
        server backend:8000 max_fails=3 fail_timeout=30s;

        # Keepalive connections to backend
        keepalive 32;
        keepalive_requests 100;
        keepalive_timeout 60s;
    }

    # ============================================================================
    # FRONTEND UPSTREAM POOL
    # ============================================================================
    upstream varuna_frontend {
        server frontend:80;
        keepalive 8;
    }

    # ============================================================================
    # TILE CACHE CONFIGURATION
    # ============================================================================
    proxy_cache_path /var/cache/nginx/tiles
                     levels=1:2
                     keys_zone=tile_cache:100m
                     max_size=10g
                     inactive=24h
                     use_temp_path=off;

    # ============================================================================
    # LOCAL DEVELOPMENT SERVER (HTTP ONLY)
    # ============================================================================
    # This block MUST appear before the catch-all redirect block.
    # Requests with Host: localhost or 127.0.0.1 (e.g. Docker healthcheck,
    # dev access) match here and are proxied to backend/frontend without
    # being redirected to HTTPS.
    server {
        listen 80;
        server_name localhost 127.0.0.1;

        # Health check — used by Docker healthcheck and monitoring
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # Nginx status for monitoring
        location /nginx_status {
            stub_status on;
            access_log off;
        }

        # Frontend (proxy to frontend container)
        location / {
            proxy_pass http://varuna_frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;  # Override client header to prevent IP spoofing
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        # API endpoints
        location /api/ {
            proxy_pass http://varuna_backend;

            limit_req zone=api burst=60 nodelay;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;  # Override client header to prevent IP spoofing
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_http_version 1.1;
            proxy_set_header Connection "";

            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # Tile caching (same as HTTPS)
        location ~ ^/api/v1/slides/[^/]+/tiles/ {
            proxy_pass http://varuna_backend;

            limit_req zone=tiles burst=200 nodelay;

            proxy_cache tile_cache;
            proxy_cache_valid 200 24h;
            proxy_cache_key "$scheme$request_method$host$request_uri";
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;

            add_header X-Cache-Status $upstream_cache_status;
            add_header X-Backend-Instance $upstream_addr;

            proxy_set_header Host $host;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }
    }

    # ============================================================================
    # HTTP SERVER (REDIRECT TO HTTPS)
    # ============================================================================
    # Catch-all for any Host that is NOT localhost/127.0.0.1.
    # Redirects to HTTPS but still exposes /health and /nginx_status so that
    # external monitors or load balancers hitting port 80 with an arbitrary
    # Host header can still health-check without following a 301.
    server {
        listen 80 default_server;
        server_name _;

        # Health check — always available on HTTP regardless of Host header
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # Nginx status for monitoring
        location /nginx_status {
            stub_status on;
            access_log off;
            allow 172.28.0.0/16;  # Docker network
            deny all;
        }

        # Redirect all other traffic to HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ============================================================================
    # HTTPS SERVER (PRODUCTION)
    # ============================================================================
    server {
        listen 443 ssl http2;
        server_name ${NGINX_SERVER_NAME};

        # SSL Configuration (TLS 1.3 only — cipher selection is managed by TLS 1.3)
        ssl_certificate ${NGINX_SSL_CERT};
        ssl_certificate_key ${NGINX_SSL_KEY};
        ssl_protocols TLSv1.3;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        # Security headers
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob:; connect-src 'self' http://localhost:8180 https://localhost:8180 ws: wss:; font-src 'self' https://fonts.gstatic.com data:; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

        # ========================================================================
        # HEALTH CHECK
        # ========================================================================
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # ========================================================================
        # FRONTEND (proxy to frontend container)
        # ========================================================================
        location / {
            proxy_pass http://varuna_frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;  # Override client header to prevent IP spoofing
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        # ========================================================================
        # API ENDPOINTS (BACKEND)
        # ========================================================================
        # WebSocket — must come BEFORE the generic /api/ block (prefix order).
        # Long-lived connections need HTTP/1.1 + Upgrade headers + extended timeout.
        location /api/v1/ws/ {
            proxy_pass http://varuna_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_buffering off;
        }

        location /api/ {
            proxy_pass http://varuna_backend;

            # Rate limiting (30 req/s per IP, burst 60)
            limit_req zone=api burst=60 nodelay;

            # Proxy headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;  # Override client header to prevent IP spoofing
            proxy_set_header X-Forwarded-Proto $scheme;

            # HTTP/1.1 for keepalive
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            # Timeouts (important for large slide operations)
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;

            # Buffering
            proxy_buffering on;
            proxy_buffer_size 128k;
            proxy_buffers 4 256k;
            proxy_busy_buffers_size 256k;

            # Disable caching for API calls (except tiles)
            proxy_cache off;
        }

        # ========================================================================
        # TILE ENDPOINTS (AGGRESSIVE CACHING)
        # ========================================================================
        location ~ ^/api/v1/slides/[^/]+/tiles/ {
            proxy_pass http://varuna_backend;

            # Rate limiting (100 req/s per IP, burst 200, no delay for bursts)
            limit_req zone=tiles burst=200 nodelay;

            # Proxy headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;  # Override client header to prevent IP spoofing
            proxy_set_header X-Forwarded-Proto $scheme;

            # HTTP/1.1 for keepalive
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            # Cache configuration (CRITICAL FOR PERFORMANCE)
            proxy_cache tile_cache;
            proxy_cache_valid 200 24h;
            proxy_cache_key "$scheme$request_method$host$request_uri";
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
            proxy_cache_background_update on;
            proxy_cache_lock on;
            proxy_cache_lock_timeout 5s;

            # Cache bypass for testing
            # proxy_cache_bypass $http_cache_control;

            # Add cache status header (for debugging)
            add_header X-Cache-Status $upstream_cache_status;
            add_header X-Backend-Instance $upstream_addr;

            # Timeouts
            proxy_connect_timeout 30s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }

        # ========================================================================
        # PROMETHEUS METRICS (RESTRICTED)
        # ========================================================================
        location /metrics {
            proxy_pass http://varuna_backend;

            # Restrict to monitoring network only
            allow 172.28.0.0/16;  # Docker network
            deny all;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

    }
}
