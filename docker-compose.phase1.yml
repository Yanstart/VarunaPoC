version: "3.8"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: varuna-backend-phase1
    ports:
      - "8000:8000"
    volumes:
      # Mount local slides directory (read-only)
      # Chemin relatif (portable Windows/Linux)
      - ./Slides:/slides:ro
    env_file:
      - ./backend/.env.phase1
    environment:
      - SLIDES_REPOSITORY_PATH=/slides
      - API_BASE_URL=http://localhost:8000
      - FRONTEND_URL=http://localhost
      - ENVIRONMENT=phase1-local
      - LOG_LEVEL=DEBUG
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 60s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - varuna-network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=http://localhost:8000
    container_name: varuna-frontend-phase1
    ports:
      - "8080:80"
    env_file:
      - ./frontend/.env.phase1
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 60s
    networks:
      - varuna-network
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: varuna-prometheus-phase1
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
      - "--web.enable-lifecycle"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://localhost:9090/-/healthy",
        ]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 60s
    networks:
      - varuna-network
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: varuna-grafana-phase1
    ports:
      - "3001:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=varuna2024
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=http://localhost:3001
      - GF_INSTALL_PLUGINS=
    depends_on:
      - prometheus
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://localhost:3000/api/health",
        ]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - varuna-network
    restart: unless-stopped

networks:
  varuna-network:
    driver: bridge
    name: varuna-phase1-network

volumes:
  prometheus-data:
    name: varuna-prometheus-phase1-data
  grafana-data:
    name: varuna-grafana-phase1-data
