# PyProject configuration for VarunaPoC Backend
# Modern Python project metadata and tool configuration

[project]
name = "varuna-poc-backend"
version = "1.7.0"
description = "VarunaPoC Backend - Digital Pathology Slide Viewer API"
authors = [
    {name = "VarunaPoC Team"}
]
requires-python = ">=3.11"
license = {text = "Proprietary - CHU UCL Namur"}

[tool.black]
line-length = 100
target-version = ['py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  # Default excludes
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
known_first_party = ["routes", "services", "utils", "core"]
skip_glob = ["venv/*", ".venv/*"]

[tool.pytest.ini_options]
# Pytest configuration for VarunaPoC Backend
minversion = "7.0"
pythonpath = ["."]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

markers = [
    # Module markers (Protocol interface areas)
    "auth: Authentication module tests",
    "storage: Storage provider tests (filesystem, S3, PACS)",
    "slides: Slide loading and tile serving tests",
    "ml: Machine learning integration tests",
    "workflow: Workflow hooks tests (PACS, RIS, LIS)",
    "cache: Tile caching tests",

    # Test type markers
    "unit: Unit tests (fast, isolated)",
    "integration: Integration tests (require external services)",
    "e2e: End-to-end tests (full stack)",
    "slow: Slow tests (>1s)",

    # Environment markers
    "requires_openslide: Requires OpenSlide library",
    "requires_redis: Requires Redis server",
    "requires_pacs: Requires PACS server connection",
    "requires_fhir: Requires reachable FHIR R4 server (e.g. HAPI FHIR dev container)",
    "requires_gpu: Requires GPU for ML inference",

    # Feature phase markers
    "phase1: Phase 1 features (basic viewer)",
    "phase2: Phase 2 features (ML, caching)",
    "phase3: Phase 3 features (collaboration, advanced ML)",

    # Domain markers (VarunaPoC feature areas, used by existing test files)
    "annotation: Annotation CRUD and schema tests",
    "db: Tests requiring PostgreSQL database",
    "detection: Detection pipeline tests",
    "focus: Focus assist tests",
    "similarity: Similarity search tests",
    "counting: Cell counting tests",
    "clustering: Clustering tests",
    "drift: Drift detection tests",
    "quality: Slide quality control tests",
    "worklist: Worklist and history tests",
    "retraining: Retraining pipeline tests",
    "load: Load/performance tests",
]

# Output configuration
addopts = [
    "-ra",
    "-v",
    "--strict-markers",
    "--strict-config",
    "--showlocals",
    "--tb=short",
    "--color=yes",
]

filterwarnings = [
    "error",
    "ignore::DeprecationWarning",
    "ignore::UserWarning:scipy",
    "ignore:A NumPy version:UserWarning",
    "ignore::ResourceWarning",
    "ignore::pytest.PytestUnraisableExceptionWarning",
]

[tool.coverage.run]
source = ["."]
omit = [
    "*/tests/*",
    "*/venv/*",
    "*/.venv/*",
    "*/config_*.py",
    "*/__pycache__/*",
]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if TYPE_CHECKING:",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"
