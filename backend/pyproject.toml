# PyProject configuration for VarunaPoC Backend
# Modern Python project metadata and tool configuration

[project]
name = "varuna-poc-backend"
version = "1.7.0"
description = "VarunaPoC Backend - Digital Pathology Slide Viewer API"
authors = [
    {name = "VarunaPoC Team"}
]
requires-python = ">=3.11"
license = {text = "Proprietary - CHU UCL Namur"}

[tool.black]
line-length = 100
target-version = ['py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  # Default excludes
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
known_first_party = ["routes", "services", "utils", "core"]
skip_glob = ["venv/*", ".venv/*"]

[tool.pytest.ini_options]
# Pytest configuration for VarunaPoC Backend
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

# Markers for modular testing
markers = [
    # Module markers
    "auth: Authentication module tests",
    "storage: Storage provider tests (filesystem, S3, PACS)",
    "slides: Slide loading and tile serving tests",
    "ml: Machine learning integration tests",
    "workflow: Workflow hooks tests (PACS, RIS, LIS)",
    "cache: Tile caching tests",

    # Test type markers
    "unit: Unit tests (fast, isolated)",
    "integration: Integration tests (require external services)",
    "e2e: End-to-end tests (full stack)",
    "slow: Slow tests (>1s)",

    # Environment markers
    "requires_openslide: Requires OpenSlide library",
    "requires_redis: Requires Redis server",
    "requires_pacs: Requires PACS server connection",
    "requires_gpu: Requires GPU for ML inference",

    # Feature flags
    "phase1: Phase 1 features (basic viewer)",
    "phase2: Phase 2 features (ML, caching)",
    "phase3: Phase 3 features (collaboration, advanced ML)",
]

# Output configuration
addopts = [
    "-ra",
    "-v",
    "--strict-markers",
    "--strict-config",
    "--showlocals",
    "--tb=short",
    "--color=yes",
]

filterwarnings = [
    "error",
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
source = ["."]
omit = [
    "*/tests/*",
    "*/venv/*",
    "*/.venv/*",
    "*/config_*.py",
    "*/__pycache__/*",
]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if TYPE_CHECKING:",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"
