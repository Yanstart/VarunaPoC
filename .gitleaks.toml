# Gitleaks v8 configuration
# Allowlist false positives for VarunaPoC
# https://github.com/gitleaks/gitleaks#configuration

[allowlist]
  description = "VarunaPoC global allowlist"
  paths = [
    # detect-secrets baseline contains hashed secrets (SHA hashes, not real secrets)
    '''\.secrets\.baseline$''',
    # Docker Compose dev file contains Keycloak/PostgreSQL dev-only passwords
    '''docker-compose\.dev\.yml$''',
    # Keycloak realm export contains test user password hashes
    '''keycloak/realm-export\.json$''',
  ]
